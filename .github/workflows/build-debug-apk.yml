name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        id: ver
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          APK_NAME="BashirConnect-${TAG}.apk"
          echo "code=${VERSION_CODE}"  >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}"  >> $GITHUB_OUTPUT
          echo "tag=${TAG}"            >> $GITHUB_OUTPUT
          echo "apk=${APK_NAME}"       >> $GITHUB_OUTPUT

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}

      # Prepare only the single versioned APK
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"

      # Creates release titled "bashirconnectapk" with only the versioned APK asset
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${{ steps.ver.outputs.apk }}" \
            --title "bashirConnect" \
            --notes "Build #${{ github.run_number }} — commit ${{ github.sha }}" \
            --latest
